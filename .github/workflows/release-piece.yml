# One piece's release, called by `release.yml` in this repository.
#
# `build` builds the piece's package, its gate (a Rust piece's tests run inside it). The
# `binary` job runs once per release target `plan` found in the flake's
# `legacyPackages.<system>.npRelease.<piece>.targets`, each on its system's runner and in
# parallel with the others, and builds, inspects and packs that target's
# `$out/bin` (one portable binary, or a relocatable client plus its libraries).
# `publish`, the only job allowed to write, creates the GitHub release once every job it
# needs passed; a piece with no targets publishes with no assets.
#
# `build` and `binary` read the optional `NP_GIT_TOKEN` (see `release.yml`) so Nix and git
# can fetch the private github.com repositories the flake depends on. `publish` does not
# receive it.
name: Release piece

on:
    workflow_call:
        inputs:
            piece:
                description: The piece's name
                required: true
                type: string
            tag:
                description: The release tag (`<piece>-vX.Y.Z`, or `vX.Y.Z` when it is the only releasable piece)
                required: true
                type: string
            note:
                description: The release note, relative to the project root
                required: true
                type: string
            kind:
                description: cli, backend, web, library, flake or unknown
                required: true
                type: string
            package:
                description: The piece's flake package (`packages.<system>.<package>`)
                required: true
                type: string
            targets:
                description: The release targets `plan` found in the flake, as JSON (`[]` when it lists none)
                required: true
                type: string
            target_sha:
                description: The commit to release
                required: true
                type: string
            nix_cache:
                description: As in `release.yml`
                required: false
                type: string
                default: ''
            nix_cache_public_key:
                description: As in `release.yml`
                required: false
                type: string
                default: ''
            linux_runner:
                description: "The runner label for the `build` job. Empty: ubuntu-latest"
                required: false
                type: string
                default: ''
        secrets:
            NP_GIT_TOKEN:
                description: A fine-grained, read-only GitHub token (Contents) for the private github.com repositories the flake fetches, such as a cargo git dependency
                required: false
            NP_NIX_CACHE_ACCESS_KEY_ID:
                description: As in `release.yml`
                required: false
            NP_NIX_CACHE_SECRET_ACCESS_KEY:
                description: As in `release.yml`
                required: false
            NP_NIX_CACHE_SIGNING_KEY:
                description: As in `release.yml`
                required: false

permissions:
    contents: read

jobs:
    build:
        runs-on: ${{ inputs.linux_runner || 'ubuntu-latest' }}
        steps:
            # crane's dependency build for a large crate tree can exceed the ~14 GB the
            # stock Linux runner has free. These preinstalled toolchains are ones no forge
            # job uses; removing them before Nix is installed frees the disk.
            - name: Free runner disk
              if: runner.os == 'Linux' && !startsWith(inputs.linux_runner, 'blacksmith-')
              shell: bash
              run: |
                  set -euo pipefail
                  df -h /
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost
                  df -h /
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.target_sha }}
                  persist-credentials: false
            # The Nix configuration: nix-community.cachix.org for fenix's prebuilt
            # Rust toolchain, and the caller's own `nix_cache` when it sets one. With
            # the cache secrets, the Nix daemon (root) reads the cache with that token
            # and a post-build hook signs and uploads every path the job builds, the
            # compiled dependencies included, so later runs fetch them.
            - name: Configure Nix and its caches
              id: nix
              shell: bash
              env:
                  NIX_CACHE: ${{ inputs.nix_cache }}
                  NIX_CACHE_PUBLIC_KEY: ${{ inputs.nix_cache_public_key }}
                  ACCESS_KEY_ID: ${{ secrets.NP_NIX_CACHE_ACCESS_KEY_ID }}
                  SECRET_ACCESS_KEY: ${{ secrets.NP_NIX_CACHE_SECRET_ACCESS_KEY }}
                  SIGNING_KEY: ${{ secrets.NP_NIX_CACHE_SIGNING_KEY }}
              run: |
                  set -euo pipefail

                  substituters=https://nix-community.cachix.org
                  keys=nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
                  hook=""

                  if [ -n "$NIX_CACHE" ]; then
                    if [ -z "$NIX_CACHE_PUBLIC_KEY" ]; then
                      echo "nix_cache is set without nix_cache_public_key" >&2
                      exit 1
                    fi
                    substituters="$substituters $NIX_CACHE"
                    keys="$keys $NIX_CACHE_PUBLIC_KEY"

                    if [ -n "$ACCESS_KEY_ID" ] && [ -n "$SECRET_ACCESS_KEY" ]; then
                      root_home=$(eval echo ~root)
                      sudo install -d -m 700 "$root_home/.aws"
                      printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
                        "$ACCESS_KEY_ID" "$SECRET_ACCESS_KEY" | sudo tee "$root_home/.aws/credentials" > /dev/null
                      sudo chmod 600 "$root_home/.aws/credentials"

                      if [ -n "$SIGNING_KEY" ]; then
                        case "$NIX_CACHE" in
                          *\?*) separator='&' ;;
                          *) separator='?' ;;
                        esac
                        sudo install -d -m 755 /etc/nix
                        printf '%s' "$SIGNING_KEY" | sudo tee /etc/nix/cache-signing-key > /dev/null
                        sudo chmod 600 /etc/nix/cache-signing-key
                        # The hook expands OUT_PATHS when it runs, not now.
                        # shellcheck disable=SC2016
                        printf '#!/bin/sh\nset -eu\n[ -n "${OUT_PATHS:-}" ] || exit 0\nexec /nix/var/nix/profiles/default/bin/nix copy --to %s $OUT_PATHS\n' \
                          "'$NIX_CACHE${separator}compression=zstd&secret-key=/etc/nix/cache-signing-key'" \
                          | sudo tee /etc/nix/upload-to-cache > /dev/null
                        sudo chmod 755 /etc/nix/upload-to-cache
                        hook=/etc/nix/upload-to-cache
                      fi
                    fi
                  fi

                  {
                    echo 'conf<<NIX_CONF'
                    echo 'experimental-features = nix-command flakes'
                    echo "extra-substituters = $substituters"
                    echo "extra-trusted-public-keys = $keys"
                    if [ -n "$hook" ]; then
                      echo "post-build-hook = $hook"
                    fi
                    echo 'NIX_CONF'
                  } >> "$GITHUB_OUTPUT"
            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: ${{ steps.nix.outputs.conf }}
            - name: Build the package
              env:
                  PACKAGE: ${{ inputs.package }}
                  NP_GIT_TOKEN: ${{ secrets.NP_GIT_TOKEN }}
              run: |
                  set -euo pipefail

                  # NP_GIT_TOKEN, when set, reads the private github.com repositories the
                  # flake fetches, for this step only: git's url rewrite carries it to git
                  # fetches (crane's `builtins.fetchGit` of a cargo git dependency,
                  # `git+https` inputs), Nix's `access-tokens` to `github:` inputs. Unset,
                  # Nix and git run as configured.
                  if [ -n "${NP_GIT_TOKEN:-}" ]; then
                    export NIX_CONFIG="access-tokens = github.com=$NP_GIT_TOKEN"
                    export GIT_CONFIG_COUNT=1
                    export GIT_CONFIG_KEY_0="url.https://x-access-token:$NP_GIT_TOKEN@github.com/.insteadOf"
                    export GIT_CONFIG_VALUE_0=https://github.com/
                  fi
                  unset NP_GIT_TOKEN

                  nix build ".#$PACKAGE" --print-build-logs

    binary:
        name: ${{ matrix.target }}
        if: fromJSON(inputs.targets)[0] != null
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(inputs.targets) }}
        runs-on: ${{ matrix.runner }}
        steps:
            # crane's dependency build for a large crate tree can exceed the ~14 GB the
            # stock Linux runner has free. These preinstalled toolchains are ones no forge
            # job uses; removing them before Nix is installed frees the disk.
            - name: Free runner disk
              if: runner.os == 'Linux' && !startsWith(matrix.runner, 'blacksmith-')
              shell: bash
              run: |
                  set -euo pipefail
                  df -h /
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost
                  df -h /
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.target_sha }}
                  persist-credentials: false
            # The Nix configuration: nix-community.cachix.org for fenix's prebuilt
            # Rust toolchain, and the caller's own `nix_cache` when it sets one. With
            # the cache secrets, the Nix daemon (root) reads the cache with that token
            # and a post-build hook signs and uploads every path the job builds, the
            # compiled dependencies included, so later runs fetch them.
            - name: Configure Nix and its caches
              id: nix
              shell: bash
              env:
                  NIX_CACHE: ${{ inputs.nix_cache }}
                  NIX_CACHE_PUBLIC_KEY: ${{ inputs.nix_cache_public_key }}
                  ACCESS_KEY_ID: ${{ secrets.NP_NIX_CACHE_ACCESS_KEY_ID }}
                  SECRET_ACCESS_KEY: ${{ secrets.NP_NIX_CACHE_SECRET_ACCESS_KEY }}
                  SIGNING_KEY: ${{ secrets.NP_NIX_CACHE_SIGNING_KEY }}
              run: |
                  set -euo pipefail

                  substituters=https://nix-community.cachix.org
                  keys=nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
                  hook=""

                  if [ -n "$NIX_CACHE" ]; then
                    if [ -z "$NIX_CACHE_PUBLIC_KEY" ]; then
                      echo "nix_cache is set without nix_cache_public_key" >&2
                      exit 1
                    fi
                    substituters="$substituters $NIX_CACHE"
                    keys="$keys $NIX_CACHE_PUBLIC_KEY"

                    if [ -n "$ACCESS_KEY_ID" ] && [ -n "$SECRET_ACCESS_KEY" ]; then
                      root_home=$(eval echo ~root)
                      sudo install -d -m 700 "$root_home/.aws"
                      printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
                        "$ACCESS_KEY_ID" "$SECRET_ACCESS_KEY" | sudo tee "$root_home/.aws/credentials" > /dev/null
                      sudo chmod 600 "$root_home/.aws/credentials"

                      if [ -n "$SIGNING_KEY" ]; then
                        case "$NIX_CACHE" in
                          *\?*) separator='&' ;;
                          *) separator='?' ;;
                        esac
                        sudo install -d -m 755 /etc/nix
                        printf '%s' "$SIGNING_KEY" | sudo tee /etc/nix/cache-signing-key > /dev/null
                        sudo chmod 600 /etc/nix/cache-signing-key
                        # The hook expands OUT_PATHS when it runs, not now.
                        # shellcheck disable=SC2016
                        printf '#!/bin/sh\nset -eu\n[ -n "${OUT_PATHS:-}" ] || exit 0\nexec /nix/var/nix/profiles/default/bin/nix copy --to %s $OUT_PATHS\n' \
                          "'$NIX_CACHE${separator}compression=zstd&secret-key=/etc/nix/cache-signing-key'" \
                          | sudo tee /etc/nix/upload-to-cache > /dev/null
                        sudo chmod 755 /etc/nix/upload-to-cache
                        hook=/etc/nix/upload-to-cache
                      fi
                    fi
                  fi

                  {
                    echo 'conf<<NIX_CONF'
                    echo 'experimental-features = nix-command flakes'
                    echo "extra-substituters = $substituters"
                    echo "extra-trusted-public-keys = $keys"
                    if [ -n "$hook" ]; then
                      echo "post-build-hook = $hook"
                    fi
                    echo 'NIX_CONF'
                  } >> "$GITHUB_OUTPUT"
            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: ${{ steps.nix.outputs.conf }}
            - name: Build, inspect and pack the binary
              env:
                  PIECE: ${{ inputs.piece }}
                  TARGET: ${{ matrix.target }}
                  SYSTEM: ${{ matrix.system }}
                  ASSETS: ${{ runner.temp }}/assets
                  NP_GIT_TOKEN: ${{ secrets.NP_GIT_TOKEN }}
              run: |
                  # Build, inspect and pack one of a piece's release targets, a CLI's or a flake
                  # piece's alike: the one the flake lists as
                  # `legacyPackages.<system>.npRelease.<piece>.targets.<target>`, packed as
                  # `<piece>-<target>.tar.gz` from every file in that target's `$out/bin`.
                  #
                  # Reads PIECE, TARGET, SYSTEM (the system this runner builds), ASSETS (the
                  # directory the archive lands in) and NP_GIT_TOKEN. Whatever builds it, a Linux
                  # binary must be static (musl), a Windows target ships `bin/<piece>.exe`, and a
                  # macOS binary must be signed. The job does not run the packed binary. macOS
                  # ships bash 3.2: no mapfile or associative arrays here.
                  set -euo pipefail

                  # NP_GIT_TOKEN, when set, reads the private github.com repositories the
                  # flake fetches, for this step only: git's url rewrite carries it to git
                  # fetches (crane's `builtins.fetchGit` of a cargo git dependency,
                  # `git+https` inputs), Nix's `access-tokens` to `github:` inputs. Unset,
                  # Nix and git run as configured.
                  if [ -n "${NP_GIT_TOKEN:-}" ]; then
                    export NIX_CONFIG="access-tokens = github.com=$NP_GIT_TOKEN"
                    export GIT_CONFIG_COUNT=1
                    export GIT_CONFIG_KEY_0="url.https://x-access-token:$NP_GIT_TOKEN@github.com/.insteadOf"
                    export GIT_CONFIG_VALUE_0=https://github.com/
                  fi
                  unset NP_GIT_TOKEN

                  fail() {
                    echo "$PIECE: $*" >&2
                    exit 1
                  }

                  # Checked before the build, so an unknown target costs no build.
                  case "$TARGET" in
                    linux-x86_64 | windows-x86_64 | darwin-aarch64 | darwin-x86_64) ;;
                    *) fail "$TARGET is not a target this workflow builds" ;;
                  esac

                  build=$(mktemp -d)
                  out="$build/$TARGET"
                  nix build ".#legacyPackages.$SYSTEM.npRelease.$PIECE.targets.$TARGET" \
                    --print-build-logs --out-link "$out"
                  case "$TARGET" in
                    linux-x86_64)
                      binary=$PIECE
                      bin="$out/bin/$binary"
                      [ -f "$bin" ] || fail "$TARGET has no bin/$binary"
                      header=$(readelf -h "$bin") || fail "$TARGET/bin/$binary is not an ELF binary"
                      grep -q 'X86-64' <<< "$header" || fail "$TARGET/bin/$binary is not an x86-64 binary"
                      # Captured first: grep -q closing a pipe early would fail readelf under pipefail.
                      programs=$(readelf -l "$bin")
                      dynamic=$(readelf -d "$bin")
                      if grep -q 'program interpreter' <<< "$programs"; then
                        fail "$TARGET/bin/$binary has a program interpreter; a released Linux binary must be static"
                      fi
                      if grep -q /nix/store <<< "$programs$dynamic"; then
                        echo "$programs$dynamic" | grep /nix/store >&2
                        fail "$TARGET/bin/$binary refers to /nix/store"
                      fi
                      ;;
                    windows-x86_64)
                      binary="$PIECE.exe"
                      [ -f "$out/bin/$binary" ] || fail "$TARGET has no bin/$binary"
                      ;;
                    darwin-aarch64 | darwin-x86_64)
                      binary=$PIECE
                      bin="$out/bin/$binary"
                      [ -f "$bin" ] || fail "$TARGET has no bin/$binary"
                      case "$TARGET" in
                        darwin-aarch64)
                          file "$bin" | grep -q arm64 || fail "$TARGET/bin/$binary is not arm64"
                          ;;
                        darwin-x86_64)
                          file "$bin" | grep -q x86_64 || fail "$TARGET/bin/$binary is not x86_64"
                          ;;
                      esac
                      # Every Mach-O under bin must be signed and free of
                      # /nix/store links.
                      while IFS= read -r -d '' mach; do
                        file "$mach" | grep -q Mach-O || continue
                        links=$(otool -L "$mach")
                        echo "$links"
                        libraries=$(tail -n +2 <<< "$links")
                        rel=${mach#"$out/bin/"}
                        if grep -q /nix/store <<< "$libraries"; then
                          fail "$TARGET/bin/$rel links a library from /nix/store"
                        fi
                        codesign -v "$mach" || fail "$TARGET/bin/$rel is not validly signed"
                      done < <(find "$out/bin" -type f -print0)
                      # No AppleDouble `._` files in the archive.
                      export COPYFILE_DISABLE=1
                      ;;
                  esac
                  mkdir -p "$ASSETS"
                  # The archive is every file in $out/bin.
                  tar czf "$ASSETS/$PIECE-$TARGET.tar.gz" -C "$out/bin" .
                  ls -l "$ASSETS"
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.tag }}-${{ matrix.target }}
                  path: ${{ runner.temp }}/assets/
                  if-no-files-found: error

    publish:
        needs: [build, binary]
        # A piece with targets publishes once every target's binary is packed; one with
        # none once it built, with the binary jobs skipped.
        if: ${{ !cancelled() && needs.build.result == 'success' && (fromJSON(inputs.targets)[0] == null || needs.binary.result == 'success') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            # For the note and the remote: this job never runs project code.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.target_sha }}
            - uses: actions/download-artifact@v4
              if: fromJSON(inputs.targets)[0] != null
              with:
                  pattern: ${{ inputs.tag }}-*
                  merge-multiple: true
                  path: ${{ runner.temp }}/assets
            - name: Publish the GitHub release
              env:
                  PIECE: ${{ inputs.piece }}
                  TAG: ${{ inputs.tag }}
                  NOTE: ${{ inputs.note }}
                  KIND: ${{ inputs.kind }}
                  TARGETS: ${{ inputs.targets }}
                  TARGET_SHA: ${{ inputs.target_sha }}
                  ASSETS: ${{ runner.temp }}/assets
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Publish a piece's GitHub release at the pinned commit, with the archives its
                  # target jobs packed. A release is published once: an existing tag or release
                  # is refused, never replaced.
                  #
                  # Reads PIECE, TAG, NOTE, KIND, TARGET_SHA, TARGETS (the JSON array of
                  # {target, system, runner} `plan` found), ASSETS (the directory holding the
                  # archives; absent for a piece with no targets) and GH_TOKEN. A piece publishes
                  # one archive, `<piece>-<target>.tar.gz`, per listed target, and nothing else;
                  # a CLI lists at least one.
                  set -euo pipefail

                  fail() {
                    echo "$PIECE: $*" >&2
                    exit 1
                  }

                  tagged=$(git ls-remote --tags origin "refs/tags/$TAG")
                  if [ -n "$tagged" ]; then
                    fail "tag $TAG already exists on origin"
                  fi
                  if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
                    fail "release $TAG already exists"
                  fi
                  if [ ! -f "$NOTE" ]; then
                    fail "$NOTE is missing at $TARGET_SHA"
                  fi
                  archives=()
                  if [ -d "$ASSETS" ]; then
                    shopt -s nullglob
                    archives=("$ASSETS"/*)
                  fi
                  if ! listed=$(jq -r '
                    if type == "array" and all(.[]; type == "object" and (.target | type == "string"))
                    then .[].target
                    else error("malformed")
                    end
                  ' <<< "$TARGETS" 2> /dev/null); then
                    fail "TARGETS must be a JSON array of {target, system, runner}, not: $TARGETS"
                  fi
                  if [ "$KIND" = cli ] && [ -z "$listed" ]; then
                    fail "a CLI release needs its archives, and TARGETS lists no target"
                  fi

                  expected=" " missing=""
                  while read -r target; do
                    [ -n "$target" ] || continue
                    archive="$PIECE-$target.tar.gz"
                    expected+="$archive "
                    [ -f "$ASSETS/$archive" ] || missing+=" $archive"
                  done <<< "$listed"
                  if [ -n "$missing" ]; then
                    fail "a release with targets needs an archive per target, and $ASSETS lacks$missing"
                  fi

                  unexpected=""
                  for archive in "${archives[@]}"; do
                    case "$expected" in
                      *" ${archive##*/} "*) ;;
                      *) unexpected+=" ${archive##*/}" ;;
                    esac
                  done
                  if [ -n "$unexpected" ]; then
                    fail "$ASSETS holds files for no listed target:$unexpected"
                  fi

                  gh release create "$TAG" --title "$TAG" --target "$TARGET_SHA" --notes-file "$NOTE" "${archives[@]}"
