name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          # nix-community.cachix.org serves fenix's Rust toolchain prebuilt.
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - run: nix flake check -L
      # Each system's release-target table instantiates, including Darwin's.
      - run: |
          nix eval --json '.#checks' --apply 'c: builtins.mapAttrs (s: v: v.rust-release-targets.drvPath) c'
